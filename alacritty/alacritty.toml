[general]
import = ["~/.config/alacritty/themes/thiago-monokai-pro.toml"]

[window]
padding = { x = 8, y = 8 }
opacity = 0.90
dimensions = { columns = 102, lines = 23 }

[font]
size = 10.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[cursor]
style = { shape = "Block", blinking = "Off" }
